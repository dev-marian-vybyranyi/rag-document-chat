# Render Blueprint: two free Docker web services. The database is an external Postgres with
# pgvector (Neon free tier in this deployment), so DATABASE_URL is entered by hand.
# Create it from the dashboard: New > Blueprint > pick this repository.

services:
  - type: web
    name: rag-chat-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass # deploy only after GitHub Actions is green
    envVars:
      - key: NODE_ENV
        value: production
      # Connection string of the external Postgres, e.g. a Neon one ending in ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # google (default) or openai; sync: false so it can be switched in the dashboard.
      - key: AI_PROVIDER
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: rag-chat-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      # Public URL of the API service, e.g. https://rag-chat-api.onrender.com
      # (asked for when the Blueprint is created). Free web services cannot receive
      # private-network traffic, so nginx has to go through the public URL.
      - key: API_UPSTREAM
        sync: false
