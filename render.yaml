# Render Blueprint: one free Postgres and two free Docker web services.
# Create it from the dashboard: New > Blueprint > pick this repository.
#
# All three resources share a region: free web services can only reach the database
# over Render's private network when they live in the same one.

databases:
  - name: rag-chat-db
    plan: free # expires 30 days after creation; see README for the trade-off
    region: frankfurt
    databaseName: ragchat
    user: ragchat
    postgresMajorVersion: '17'

services:
  - type: web
    name: rag-chat-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass # deploy only after GitHub Actions is green
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rag-chat-db
          property: connectionString
      # google (default) or openai; sync: false so it can be switched in the dashboard.
      - key: AI_PROVIDER
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: rag-chat-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      # Public URL of the API service, e.g. https://rag-chat-api.onrender.com
      # (asked for when the Blueprint is created). Free web services cannot receive
      # private-network traffic, so nginx has to go through the public URL.
      - key: API_UPSTREAM
        sync: false
